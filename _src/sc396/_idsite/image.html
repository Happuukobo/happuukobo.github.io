<html><head><meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS" /><title>ID_Image_Window</title><style type="text/css"><!--.info {	font-family: "ヒラギノ角ゴ Pro W6", "Osaka", "ＭＳ Ｐゴシック";	font-size: 9px;	color: #333333;}--></style></head><body bgcolor="#ffffff" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0"><table width="100%" border="0" cellpadding="3" cellspacing="0" bgcolor="#CCCCCC">  <tr>    <td class="info">Windowsでは、画像の上でマウスを右クリック&gt;[名前を付けて画像を保存]を選択。<br>  Macは画像をデスクトップにドラッグすると、ハードディスクにデータをダウンロードできます。</td>  </tr></table><script type="text/javascript">var tmp = location.search + "&";function getData(myN, def) {	var p1 = tmp.indexOf(myN);	if (p1 != -1) {		var p2 = tmp.indexOf('=', p1) + 1;		var p3 = tmp.indexOf('&', p2);		return unescape(tmp.substring(p2, p3));	} else {		return def;	}}n = getData('file', '');document.write('<IMG SRC="' + n + '">');</script></body></html>
